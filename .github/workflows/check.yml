name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Git identity for tests that commit
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - run: scripts/check
